name: order-supervisor

services:
  postgres:
    image: postgres:16-alpine
    container_name: order-supervisor-postgres
    environment:
      POSTGRES_DB: order_supervisor
      POSTGRES_USER: order_supervisor
      POSTGRES_PASSWORD: order_supervisor_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_supervisor -d order_supervisor"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  temporal:
    image: temporalio/temporal:1.8.3
    container_name: order-supervisor-temporal
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal_data:/home/temporal
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - 127.0.0.1:7233
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
    name: order-supervisor-postgres-data
  temporal_data:
    name: order-supervisor-temporal-data
